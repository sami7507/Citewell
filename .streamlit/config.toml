# Streamlit theme for Citewell (light, cool-grey desk with teal actions).
# Custom styling lives in frontend/theme.py; this file lets Streamlit's own
# widgets (uploader, slider, buttons) pick contrast-correct colours natively.

[theme]
base = "light"
primaryColor = "#0D5C63"
backgroundColor = "#F2F4F1"
secondaryBackgroundColor = "#E8EDEA"
textColor = "#14201C"
font = "sans serif"

[server]
# Explicit upload cap: very large PDFs can exhaust a free-tier instance.
maxUploadSize = 50

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
